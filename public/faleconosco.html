<!DOCTYPE html>
<html lang="pt-BR">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fale Conosco - Cidades+</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="assets/styles.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu">
        <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    </head>
    <body>
        <header class="header_index">
            <div class="header_mobile_index">
                <div class="logo_name_index">
                    <img class="logo_cdd_header" src="img/logo_cdd.png" alt="Logo do Cidades+">
                    <h1 class="h1_index">Cidades<span class="simbolo_mais">+</span></h1>
                </div>
                <span class="material-symbols-outlined">menu</span>
            </div>
            <nav>
                <ul class="menu">
                    <li class="pg_atual"><a href="index.html">Início</a></li>
                    <li><a href="como-funciona.html">Como funciona</a></li>
                    <li><a href="sobre_nos.html">Sobre nós</a></li>
                    <li class="item_denuncias_header"><a href="painelcidadao.html">Denúncias</a></li>
                    <li class="entrar_botao_index"><a href="login.html">Entrar</a></li>
                    <li class="baixar_agora"><a href="#">Baixar agora</a></li>
                </ul>
            </nav>
        </header>
        <main class="main_faleconosco">
            <section class="section_faleconosco">
                <div class="container_faleconosco">
                    <h1 class="h2_faleconosco">Fale Conosco</h1>
                    <p class="p_faleconosco">Tem alguma dúvida, sugestão ou precisa de suporte? Envie sua mensagem.</p>
                    <form class="form_faleconosco" id="form_faleconosco" action="https://formsubmit.co/cidadesmais13@gmail.com" method="POST">
                        <div class="grupo_campos_faleconosco">
                            <label for="nome_faleconosco">Nome</label>
                            <input type="text" id="nome_faleconosco" name="nome" placeholder="Seu nome completo" minlength="3" required>
                        </div>
                        <div class="grupo_campos_faleconosco">
                            <label for="email_faleconosco">E-mail</label>
                            <input type="email" id="email_faleconosco" name="email" placeholder="seu@email.com" required>
                        </div>
                        <div class="grupo_campos_faleconosco">
                            <label for="assunto_faleconosco">Assunto</label>
                            <input type="text" id="assunto_faleconosco" name="assunto" placeholder="Sobre o que você quer falar?" minlength="5" required>
                        </div>
                        <div class="grupo_campos_faleconosco">
                            <label for="mensagem_faleconosco">Mensagem</label>
                            <textarea id="mensagem_faleconosco" name="mensagem" placeholder="Escreva aqui sua mensagem..."minlength="10" required></textarea>
                        </div>
                        <button type="submit" class="botao_faleconosco">Enviar mensagem</button>
                        <p class="mensagem_status_faleconosco" id="feedback_faleconosco" role="alert"></p>
                    </form>
                </div>
            </section>
        </main>
        <script src="assets/script.js"></script>
    </body>
</html>
